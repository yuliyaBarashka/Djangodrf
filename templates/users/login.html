{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — M2Bilingual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
       body {
           background: #f5f5f7;               /* простой светлый фон, без градиента */
           min-height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
           margin: 0;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       }
       .login-card {
           background: #ffffff;
           padding: 40px;
           border-radius: 16px;
           box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
           width: 100%;
           max-width: 400px;
       }
       .login-card h1 {
           text-align: center;
           margin-bottom: 24px;
           font-weight: 800;
           color: #000000;                     /* чёрный */
           -webkit-text-fill-color: #000000;   /* на случай, если остался webkit-градиент */
           background: none;                   /* убрать градиент */
       }
   </style>
</head>
<body>

<div class="login-card">
    <h1>M2Bilingual</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>

    <p class="text-center mt-3">
        <a href="/">← На главную</a>
    </p>
</div>

</body>
</html>
