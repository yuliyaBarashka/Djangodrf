<div class="list-group-item d-flex justify-content-between align-items-center" id="lesson-{{ lesson.id }}">
    <div class="flex-grow-1">
        <h5 class="mb-1">
            {{ lesson.name }}
            {% if lesson.is_test %}
                <span class="badge bg-warning text-dark">Контрольная</span>
            {% endif %}
            {% if lesson.video_url %}
                <span class="badge bg-info">📹</span>
            {% endif %}
            {% if lesson.lecture_pdf %}
                <span class="badge bg-secondary">📄</span>
            {% endif %}
            {% if lesson.workbook_pdf %}
                <span class="badge bg-secondary">📝</span>
            {% endif %}
        </h5>
        <small class="text-muted">{{ lesson.description|truncatechars:100 }}</small>
    </div>
    <div class="d-flex gap-1">
        {% if lesson.is_test %}
            <a href="{% url 'lms:teacher_test_questions' lesson.id %}"
               class="btn btn-sm btn-outline-warning"
               title="Вопросы контрольной">
                ❓
            </a>
        {% endif %}

        <a href="{% url 'lms:teacher_lesson_preview' lesson.id %}"
           class="btn btn-sm btn-outline-secondary"
           target="_blank"
           title="Посмотреть как ученик">
            👁
        </a>

        <button class="btn btn-sm btn-outline-primary"
                hx-get="{% url 'lms:teacher_lesson_edit_form' lesson.id %}"
                hx-target="#lesson-{{ lesson.id }}"
                hx-swap="outerHTML"
                title="Редактировать">
            <i class="fas fa-edit"></i>
        </button>

        <button class="btn btn-sm btn-outline-danger"
                hx-delete="{% url 'lms:teacher_lesson_delete' lesson.id %}"
                hx-target="#lesson-{{ lesson.id }}"
                hx-swap="outerHTML"
                hx-confirm="Удалить урок?"
                title="Удалить">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</div>
