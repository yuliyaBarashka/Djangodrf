{% extends 'lms/teacher/base_teacher.html' %}

{% block title %}Создать курс — M2Bilingual{% endblock %}

{% block content %}
<h1 class="page-title">Создать курс</h1>

<div class="card-stat" style="max-width: 600px;">
    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Название курса</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus"></i> Создать курс
        </button>
        <a href="{% url 'lms:teacher_dashboard' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
