version: '3.8'

services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: m2bilingual_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m2bilingual_db}
      POSTGRES_USER: ${POSTGRES_USER:-m2bilingual_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword2026!}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m2bilingual_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m2bilingual_network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: m2bilingual_redis
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m2bilingual_network

  # ============================================================
  # Django + Gunicorn
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m2bilingual_app
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m2bilingual_db}
      POSTGRES_USER: ${POSTGRES_USER:-m2bilingual_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword2026!}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "
    networks:
      - m2bilingual_network

  # ============================================================
  # Celery Worker
  # ============================================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m2bilingual_celery
    restart: always
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m2bilingual_db}
      POSTGRES_USER: ${POSTGRES_USER:-m2bilingual_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword2026!}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info
    networks:
      - m2bilingual_network

  # ============================================================
  # Celery Beat
  # ============================================================
  celerybeat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m2bilingual_celerybeat
    restart: always
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m2bilingual_db}
      POSTGRES_USER: ${POSTGRES_USER:-m2bilingual_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword2026!}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info
    networks:
      - m2bilingual_network

  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: m2bilingual_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - app
    networks:
      - m2bilingual_network

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:


# ============================================================
# Networks
# ============================================================
networks:
  m2bilingual_network:
    driver: bridge